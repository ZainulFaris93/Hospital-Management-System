services:
  - type: web
    name: starcare-hospital
    runtime: python
    plan: free
    rootDir: hospital_project
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    # Fresh demo database on every start: migrate, then load demo data
    startCommand: python manage.py migrate --no-input && python manage.py seed_demo && gunicorn hospital_project.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "True"
