name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    name: Django unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hospital_project
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: hospital_project/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          USE_SQLITE: 'True'
        run: python manage.py test hospital_app -v 2

  e2e:
    name: Playwright end-to-end tests
    needs: django
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: hospital_project/requirements.txt
      - run: pip install -r ../hospital_project/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright
        env:
          CI: 'true'
          PYTHON: python
        run: npx playwright test
      - name: Keep the HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
      - name: Prepare report for GitHub Pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: e2e/playwright-report

  publish-report:
    name: Publish test report
    needs: e2e
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
